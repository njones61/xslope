site_name: XSLOPE
site_url: https://xslope.readthedocs.io/en/latest/
site_description: >-
  Free, open-source slope stability and seepage analysis software: seven limit
  equilibrium methods, finite element seepage and finite element strength reduction
  from one model, for macOS, Windows and Python.
site_author: Norm Jones
repo_url: https://github.com/njones61/xslope/
copyright: Copyright &copy; 2025 Norman L. Jones. Licensed under Apache 2.0.
extra_javascript:
  - https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.0/es5/tex-mml-chtml.js
  - js/mathjax-config.js
  - js/nav_collapse.js
markdown_extensions:
    - attr_list
    - sane_lists
    - md_in_html
    - admonition
    - pymdownx.arithmatex:
        generic: true
theme:
  name: readthedocs
  custom_dir: overrides
  navigation_depth: 2
  titles_only: true
extra_css:
  - css/custom.css
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["."]
          options:
            docstring_style: google
            show_signature_annotations: false
hooks:
  - hooks/griffe_quiet.py
  - hooks/docs_packages.py
nav:
  - Home: index.md
  - Installation: getting_started/install.md
  - Usage Guide:
    - Ways to Use XSLOPE: usage/index.md
    - Input Template: usage/input_template.md
    - Project Packaging: usage/packaging.md
    - Preflight Input Checks: usage/preflight.md
    - Colab Notebooks: usage/notebooks.md
    - Claude Code Skill: usage/claude/index.md
    - DXF Import/Export: usage/dxf.md
    - GeoStudio Import/Export: usage/geostudio.md
  - XSLOPE Studio:
    - Overview: studio/index.md
    - The Interface: studio/interface.md
    - Editing Inputs: studio/editing.md
    - Running Analyses: studio/analysis.md
    - Analysis Report: studio/reports.md
    - AI Assistant: studio/assistant.md
    - App Management: studio/app_management.md
  - Tutorials:
    - Overview: tutorials/index.md
    - Building Models Three Ways: tutorials/building_models.md
    - Limit Equilibrium:
      - 1. Simple Embankment: tutorials/lem01_simple_embankment.md
      - 2. Loads on the Crest: tutorials/lem02_loads_on_the_crest.md
      - 3. A Layered Slope: tutorials/lem03_layered_slope.md
      - 4. Water in the Slope: tutorials/lem04_water_in_the_slope.md
      - 5. A Weak Layer, Non-Circular: tutorials/lem05_weak_layer_noncircular.md
      - 6. Polygon Geometry: tutorials/lem06_polygon_geometry.md
      - 7. Strength Options Beyond Mohr-Coulomb: tutorials/lem07_strength_envelopes.md
      - 8. A Reinforced Slope (Geogrids): tutorials/lem08_reinforced_slope.md
      - 9. A Tieback Wall: tutorials/lem09_tieback_wall.md
      - 10. Finding the Global Minimum: tutorials/lem10_global_minimum.md
      - 11. Reliability: tutorials/lem11_reliability.md
      - 12. Piles: tutorials/lem12_piles.md
      - "13. A Rock Slope: Hoek-Brown": tutorials/lem13_rock_slope.md
    - Seepage:
