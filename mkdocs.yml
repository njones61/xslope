site_name: XSLOPE
site_url: https://xslope.readthedocs.io/en/latest/
site_description: >-
  Free, open-source slope stability and seepage analysis software: seven limit
  equilibrium methods, finite element seepage and finite element strength reduction
  from one model, for macOS, Windows and Python.
site_author: Norm Jones
repo_url: https://github.com/njones61/xslope/
copyright: Copyright &copy; 2025 Norman L. Jones. Licensed under Apache 2.0.
extra_javascript:
  - https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.0/es5/tex-mml-chtml.js
  - js/mathjax-config.js
markdown_extensions:
    - attr_list
    - sane_lists
    - md_in_html
    - admonition
    - pymdownx.arithmatex:
        generic: true
theme:
  name: readthedocs
  custom_dir: overrides
extra_css:
  - css/custom.css
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["."]
          options:
            docstring_style: google
            show_signature_annotations: false
hooks:
  - hooks/griffe_quiet.py
  - hooks/docs_packages.py
nav:
  - Home: index.md
  - Install: getting_started/install.md
  - XSLOPE Studio:
    - Overview: studio/index.md
    - The Interface: studio/interface.md
    - Editing Inputs: studio/editing.md
    - Running Analyses: studio/analysis.md
    - Analysis Report: studio/reports.md
    - AI Assistant: studio/assistant.md
    - App Management: studio/app_management.md
  - Usage Guide:
    - Python Package Install: usage/installation.md
    - Input Template: usage/input_template.md
    - Project Packaging: usage/packaging.md
    - Preflight Input Checks: usage/preflight.md
    - Colab Notebooks: usage/notebooks.md
    - Claude Code Skill: usage/claude/index.md
    - DXF Import/Export: usage/dxf.md
    - GeoStudio Import/Export: usage/geostudio.md
  - Limit Equilibrium Method:
    - Overview: lem/overview.md
    - Ordinary Method of Slices: lem/oms.md
    - Bishop's Simplified Method: lem/bishop.md
    - Janbu Method: lem/janbu.md
    - Force Equilibrium Methods: lem/force_eq.md
    - Spencer's Method: lem/spencer.md
    - Morgenstern–Price Method: lem/mprice.md
    - Soil Reinforcement: lem/reinforcement.md
    - Piles and Concrete Piers: lem/piles.md
    - Rapid Drawdown Analysis: lem/rapid.md
    - Automated Search Algorithms: lem/search.md
    - Sample Problems: lem/samples.md
  - Reliability:
    - Overview: reliability/index.md
    - Taylor Series (TSPM): reliability/taylor.md
    - Monte Carlo: reliability/monte_carlo.md
    - FEM Reliability (SSRM): reliability/fem.md
  - Parametric:
    - Overview: parametric/index.md
    - Sensitivity: parametric/sensitivity.md
    - Design Mode: parametric/design.md
    - Back-Analysis: parametric/back_analysis.md
  - Seepage Analysis:
    - Overview: seep/overview.md
    - Transient Seepage: seep/transient.md
    - Seep-Slope Integration: seep/seep_slope.md
    - Sample Problems: seep/samples.md
  - Finite Element Method:
    - Overview: fem/overview.md
    - Soil Reinforcement: fem/reinforcement.md
    - Piles and Concrete Piers: fem/piles.md
    - Mesh Generation: fem/mesh.md
    - Sample Problems: fem/samples.md
  - Verification:
    - Overview: verification/index.md
    - FE Seepage: verification/seep.md
    - FE Slope Stability (SSRM): verification/ssrm.md
    - Rocscience Slide2 Corpus: verification/rocscience.md
    - Rocscience Groundwater Corpus: verification/rocscience_groundwater.md
    - Rocscience RS2 (SSRM) Corpus: verification/rs2.md
    - GeoStudio (SLOPE/W) Corpus: verification/geostudio.md
    - References: verification/references.md
  - API:
    - Advanced: api/advanced.md
    - FEM: api/fem.md
    - File I/O: api/fileio.md
    - Generators: api/generators.md
    - Global Config: api/global_config.md
    - Mesh: api/mesh.md
    - Plot: api/plot.md
    - Plot FEM: api/plot_fem.md
    - Plot SEEP: api/plot_seep.md
    - Preflight: api/preflight.md
    - Remedies: api/remedies.md
    - SEEP: api/seep.md
    - Search: api/search.md
    - Slice: api/slice.md
    - Solve: api/solve.md
  - Coding:
      - Contributing: coding/contributing.md

