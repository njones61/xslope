[build-system]
requires = [
  "setuptools>=68,<77",
  "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "xslope"
dynamic = ["version"]
description = "Python package for seepage and slope stability analysis"
readme = { file = "README.md", content-type = "text/markdown" }
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
authors = [
  { name = "Norman L. Jones" }
]
keywords = [
  "slope", "stability", "geotechnical", "FEM", "limit equilibrium"
]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy",
  "pandas",
  "matplotlib",
  "scipy",
  "shapely",
  "openpyxl",
  "lxml",        # fileio imports it at module scope for the XML-level xlsx writer
  "tabulate",    # solve + advanced import it at module scope
  "python-docx", # report_docx writes the Analysis Report
]

[project.optional-dependencies]
fem = ["gmsh"]
cad = ["ezdxf"]                  # DXF import/export (xslope.cad)
gui = ["PySide6", "pyobjc-framework-Cocoa; sys_platform == 'darwin'", "ezdxf"]
ai = ["litellm", "keyring"]

[project.scripts]
xslope-studio = "studio.app:main"

[project.urls]
Homepage = "https://github.com/njones61/xslope"
Documentation = "https://xslope.readthedocs.io/en/latest/"
Source = "https://github.com/njones61/xslope"
Issues = "https://github.com/njones61/xslope/issues"

[tool.setuptools.packages.find]
# Recurse so current AND future subpackages (e.g. studio.ai) always ship.
# An explicit list like ["xslope", "studio"] does NOT recurse and silently
# dropped studio/ai from the wheel — see the v0.1.57 packaging fix.
include = ["xslope*", "studio*"]

[tool.setuptools.package-data]
xslope = ["resources/*"]
studio = ["resources/*"]

[tool.setuptools.dynamic]
version = { attr = "xslope._version.__version__" }

